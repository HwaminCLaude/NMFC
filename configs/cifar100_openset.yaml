# CIFAR-100 개방셋(open-set) 80/100 실험 — 224px 본실험
# shrb(v3 최고 성능)를 구조 그대로 두고 데이터 분할만 변경: 랜덤 80클래스만 gradient 학습,
# 20클래스는 미학습. 테스트는 100클래스 전체. 평가 A(뱅크=100 → 100-way top1) + 평가 B(뱅크=80 →
# near-OOD AUC)를 한 학습으로 산출. 기존 cifar100*.yaml/캐시는 절대 불변(runner:openset 게이트).
base: base.yaml
runner: openset

defaults:
  dataset: cifar100
  img_size: 224
  epochs: 40
  embed_dim: 128
  batch_p: 48        # v1 nmfc 튜닝 그대로 (PK 48×4=192); n_seen=80 ≥ 48 만족
  batch_k: 4
  batch_size: 192
  num_workers: 4
  eval_subset: 2000
  optim: {lr: 3.0e-4}
  apt: {delta: 1.0e-3, max_warmup: 5}
  open_set: {n_seen: 80, split_seed: 0}   # 랜덤 80 seen / 20 novel (고정 시드)

experiments:
  # shrb와 동일한 변형(softmin+hinge_temp) — closed-set 대조는 캐시된 c100v_shrb(0.845)
  - {name: c100v_shrb_open, method: nmfc, variant: {energy: softmin, logit: hinge_temp},
     nmfc: {k1: 3, k2: 32}}   # PK 48×4 LOO 상한: k1 ≤ batch_k−1 = 3
  # softmax 대조군 — 100-logit 중 novel 20은 미학습이라 구조상 100-way 분류 불가(novel top1≈0)
  - {name: c100v_softmax_open, method: softmax}
