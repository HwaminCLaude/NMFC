# OOD v3 모듈 변형 웨이브 2 — CIFAR-10(in) vs SVHN(out), 224px 본실험
# 기존 ood_cifar10.yaml/캐시(ood_cifar10_nmfc=v1, ood_cifar10_softmax)는 절대 불변.
# 점수 = head.ood_score = min_k E⁺_k. run_ood는 _run_image_core를 통과하므로 variant 무수정 동작.
base: base.yaml
runner: ood

defaults:
  dataset: cifar10
  ood_dataset: svhn
  img_size: 224
  epochs: 40
  embed_dim: 128
  batch_p: 10        # CIFAR-10: 전체 10 클래스
  batch_k: 19        #           × 19 = 190 (224px VRAM 제약). batch_k=19라 배치 내 softmin k1=16 가능
  batch_size: 192    # 온라인 뱅크(shuffle) 표준 배치
  num_workers: 4
  eval_subset: 2000
  optim: {lr: 3.0e-4}
  # 캐시된 v1 OOD(ood_cifar10_nmfc)는 전환 20 — 변형도 전환 ~20으로 맞춰 델타가 모듈 효과로 귀속되게 한다.
  # (wave1 CIFAR-100이 v1 전환 5에 맞춘 것과 동일 원리. 5k 프로브+SGD 노이즈라 δ=1e-3 미발동 → max_warmup가 전환.)
  apt: {delta: 1.0e-3, max_warmup: 20}
  # negJ(ACS)도 전환 ~20으로 정렬. W+P=6 ≤ t_min=6 (assert). Phase I은 PK라 -J well-conditioned.
  acs: {delta: 1.0e-3, t_min: 6, t_max: 20, ramp: 3, window: 3, patience: 3}

experiments:
  # v1 기준점은 캐시된 ood_cifar10_nmfc(AUC 0.937)를 그대로 씀 — 여기 재실행 안 함.
  # CIFAR-10 배치 10×19라 minibatch softmin도 k1=16 사용 가능(wave1 CIFAR-100은 batch_k=4라 k1=3 강제였음).
  - {name: ood10v_mhrb, method: nmfc, variant: {logit: hinge_temp},
     nmfc: {k1: 16, k2: 16}}
  - {name: ood10v_shrb, method: nmfc, variant: {energy: softmin, logit: hinge_temp},
     nmfc: {k1: 16, k2: 16}}
  - {name: ood10v_shjb, method: nmfc, variant: {energy: softmin, logit: hinge_temp, apt: negJ},
     nmfc: {k1: 16, k2: 16}}
  - {name: ood10v_shjo, method: nmfc,
     variant: {energy: softmin, logit: hinge_temp, apt: negJ, bank: online},
     nmfc: {k1: 16, k2: 16}}  # 완전 v3
