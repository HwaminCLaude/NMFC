# 노이즈 그리드 웨이브 B — 개방셋 시드 축 (seed 2): clean + rate {5,20}% 브래킷.
base: base.yaml
runner: openset
seed: 2

defaults:
  dataset: cifar100
  img_size: 224
  epochs: 40
  embed_dim: 128
  batch_p: 48
  batch_k: 4
  batch_size: 192
  num_workers: 4
  eval_subset: 2000
  optim: {lr: 3.0e-4}
  apt: {delta: 1.0e-3, max_warmup: 5}
  open_set: {n_seen: 80, split_seed: 0}

experiments:
  - {name: c100v_shrb_open_s2, method: nmfc,
     variant: {energy: softmin, logit: hinge_temp}, nmfc: {k1: 3, k2: 32}}
  - {name: c100v_softmax_open_s2, method: softmax}
  - {name: c100v_shrb_open_ns5_s2, method: nmfc,
     variant: {energy: softmin, logit: hinge_temp}, nmfc: {k1: 3, k2: 32},
     label_noise: {rate: 0.05, seed: 0, scope: seen}}
  - {name: c100v_softmax_open_ns5_s2, method: softmax,
     label_noise: {rate: 0.05, seed: 0, scope: seen}}
  - {name: c100v_shrb_open_na5_s2, method: nmfc,
     variant: {energy: softmin, logit: hinge_temp}, nmfc: {k1: 3, k2: 32},
     label_noise: {rate: 0.05, seed: 0, scope: all}}
  - {name: c100v_softmax_open_na5_s2, method: softmax,
     label_noise: {rate: 0.05, seed: 0, scope: all}}
  - {name: c100v_shrb_open_ns20_s2, method: nmfc,
     variant: {energy: softmin, logit: hinge_temp}, nmfc: {k1: 3, k2: 32},
     label_noise: {rate: 0.20, seed: 0, scope: seen}}
  - {name: c100v_softmax_open_ns20_s2, method: softmax,
     label_noise: {rate: 0.20, seed: 0, scope: seen}}
  - {name: c100v_shrb_open_na20_s2, method: nmfc,
     variant: {energy: softmin, logit: hinge_temp}, nmfc: {k1: 3, k2: 32},
     label_noise: {rate: 0.20, seed: 0, scope: all}}
  - {name: c100v_softmax_open_na20_s2, method: softmax,
     label_noise: {rate: 0.20, seed: 0, scope: all}}
